# Engineering Theme
# Forked from Iconic Theme (mairisskuja/iconic-home-assistant-theme),
# itself a fork of luxury_dashboard (ruudmens/home-assistant-dashboard).
# Uses Apple's SF font family via the system font stack: SF Pro on Apple
# devices, with native fallbacks elsewhere (SF is not licensed for web
# hosting, so it is never downloaded).
#
# Accessibility (WCAG 2.2 AA, checked against HA frontend 20260826.7):
# - Colours live under `modes: dark:`. Without it HA treats the theme as a
#   light theme and keeps light form/menu/dialog surfaces under white text.
# - Text >= 4.5:1, UI component boundaries (tracks, borders, focus) >= 3:1.
# - Text on gold fills is dark; white on #eac578 is only 1.65:1.
# - Off and on states differ in colour, not just in position.
engineering_theme:
  # Font: SF Pro (text + display) and SF Mono
  ha-font-family-body: &sf-pro '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Roboto, "Segoe UI", sans-serif'
  ha-font-family-heading: &sf-pro-display '-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Roboto, "Segoe UI", sans-serif'
  ha-font-family-longform: *sf-pro
  ha-font-family-code: &sf-mono 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace'
  primary-font-family: *sf-pro
  paper-font-common-base_-_font-family: *sf-pro
  paper-font-common-code_-_font-family: *sf-mono
  paper-font-body1_-_font-family: *sf-pro
  paper-font-subhead_-_font-family: *sf-pro
  paper-font-headline_-_font-family: *sf-pro-display
  paper-font-caption_-_font-family: *sf-pro
  paper-font-title_-_font-family: *sf-pro-display
  # Material (mdc/md3) and Web Awesome components default to Roboto
  mdc-typography-font-family: *sf-pro
  md-ref-typeface-plain: *sf-pro
  md-ref-typeface-brand: *sf-pro-display
  wa-font-family-body: *sf-pro
  wa-font-family-heading: *sf-pro-display
  wa-font-family-longform: *sf-pro
  wa-font-family-code: *sf-mono
  # Places HA hardcodes Roboto are covered by www/theme-fonts.js

  # Cards
  ha-card-border-radius: "16px"
  ha-card-box-shadow: "0 4px 24px rgba(0, 0, 0, 0.3)"

  # Lovelace card mod
  card-mod-theme: engineering_theme

  modes:
    dark:
      # Gold ramp; switches, buttons, links and focus rings read these
      ha-color-primary-05: "#1d170c"
      ha-color-primary-10: "#2e2410"
      ha-color-primary-20: "#4a3916"
      ha-color-primary-30: "#6b521c"
      ha-color-primary-40: "#7d5f1c"
      ha-color-primary-50: "#b08a3a"
      ha-color-primary-60: "#d4ad5c"
      ha-color-primary-70: "#eac578"
      ha-color-primary-80: "#f2d9a6"
      ha-color-primary-90: "#f8ebcf"
      ha-color-primary-95: "#fcf5e7"

      # Primary colors
      primary-color: "#eac578"
      light-primary-color: "#f2d9a6"
      dark-primary-color: "#b08a3a"
      accent-color: "#eac578"

      # Text on gold fills (9.96:1)
      text-primary-color: "#211f1f"
      text-light-primary-color: "#211f1f"
      text-accent-color: "#211f1f"
      ha-color-on-primary-loud: "#211f1f"

      # Loud (filled) buttons: gold with dark text, 8.75:1 against cards
      ha-color-fill-primary-loud-resting: "#eac578"
      ha-color-fill-primary-loud-hover: "#f2d9a6"
      ha-color-fill-primary-loud-active: "#eac578"
      ha-color-border-primary-loud: "#d4ad5c"
      ha-color-focus: "#d4ad5c"

      # Background colors
      primary-background-color: "#211f1f"
      secondary-background-color: "#2c292a"
      card-background-color: "#2c292a"
      ha-card-background: "#2c292a"

      # Text colors
      primary-text-color: "#ffffff"
      secondary-text-color: "#c2bbb3"
      disabled-text-color: "rgba(255, 255, 255, 0.5)"

      # Header
      app-header-background-color: "#211f1f"
      app-header-text-color: "#ffffff"

      # Sidebar
      sidebar-background-color: "#211f1f"
      sidebar-text-color: "#ffffff"
      sidebar-icon-color: "#c2bbb3"
      sidebar-selected-background-color: "#3a3536"
      sidebar-selected-text-color: "#eac578"
      sidebar-selected-icon-color: "#eac578"

      # Buttons
      mdc-button-outline-color: "#eac578"

      # Dividers
      divider-color: "rgba(255, 255, 255, 0.1)"

      # States: off is neutral, on is gold
      state-icon-color: "#c2bbb3"
      state-icon-active-color: "#eac578"

      # Sliders
      ha-slider-thumb-color: "#eac578"
      ha-slider-indicator-color: "#eac578"
      ha-slider-track-color: "#8a827c"

      # Inputs and dropdowns
      input-fill-color: "#363233"
      input-ink-color: "#ffffff"
      input-label-ink-color: "#c2bbb3"
      input-dropdown-icon-color: "#c2bbb3"
      # Pickers and dropdown fields (HA default is cool grey #363636)
      ha-color-form-background: "#363233"
      ha-color-form-background-hover: "#403b3c"
      ha-color-form-background-disabled: "#363233"

      # Code editor syntax. HA's dark defaults assume #1c1c1c; these clear
      # 4.5:1 on the card (#2c292a) and on the highlighted active line.
      codemirror-comment: "#aca59e"
      codemirror-variable: "#f58a90"
      codemirror-string-2: "#f58a90"
      codemirror-number: "#ff8a9c"
      codemirror-tag: "#ff8a9c"
      codemirror-keyword: "#c792ea"
      codemirror-operator: "#89ddff"
      codemirror-variable-2: "#eeffff"
      codemirror-variable-3: "#decb6b"
      codemirror-builtin: "#ffcb6b"
      codemirror-atom: "#f78c6c"
      codemirror-def: "#82aaff"
      codemirror-string: "#c3e88d"
      codemirror-meta: "#ffcb6b"
      codemirror-attribute: "#c792ea"
      codemirror-property: "#c792ea"
      codemirror-qualifier: "#decb6b"
      codemirror-type: "#decb6b"
